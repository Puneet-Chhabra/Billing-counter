name: Trigger auto deployment for ca-billing-prod

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-billing-prod-AutoDeployTrigger-f504e7aa-a4ce-4d36-87bb-6fc9667be767.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CABILLINGPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CABILLINGPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CABILLINGPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.CABILLINGPROD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CABILLINGPROD_REGISTRY_PASSWORD }}
          containerAppName: ca-billing-prod
          resourceGroup: rg-billing-prod
          imageToBuild: ghcr.io/ca-billing-prod:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


