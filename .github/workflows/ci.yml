name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/billing-web/package-lock.json
      - run: dotnet test BillingSoftware.slnx --configuration Release
      - run: npm ci
        working-directory: frontend/billing-web
      - run: npm run lint
        working-directory: frontend/billing-web
      - run: npm run build
        working-directory: frontend/billing-web
      - run: docker build --tag billing-counter:ci .
